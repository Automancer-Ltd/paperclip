name: commitperclip PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# Always runs from base branch context — never executes PR code.
# pull_request_target gives access to secrets for untrusted fork PRs.
#
# The commitperclip gates need the commitperclip GitHub App (app id 3718661,
# owned by paperclipai) installed on this repository plus its private key in the
# COMMITPERCLIP_KEY secret. A fork that has neither (Automancer-Ltd/paperclip)
# cannot mint an installation token, so those gates are skipped with a notice
# instead of failing on every pull request. Dependency Review is independent and
# always runs.

permissions:
  pull-requests: write
  checks: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout base branch (never PR code)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: master

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # The `secrets` context is not available to `if:` expressions, so the
      # secret is read once here and published as a step output the later steps
      # gate on. Kept step-scoped (never job-scoped) so the value is not handed
      # to unrelated actions.
      - name: Check for a commitperclip key
        id: key
        env:
          COMMITPERCLIP_KEY: ${{ secrets.COMMITPERCLIP_KEY }}
        run: |
          if [ -n "$COMMITPERCLIP_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "COMMITPERCLIP_KEY is set: running the commitperclip quality gates."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=commitperclip review skipped::COMMITPERCLIP_KEY is not set on $GITHUB_REPOSITORY, so the commitperclip quality gates (PR template, linked issue, dedup search, test coverage, lockfile, dependencies, release bootstrap, co-authors) did not run. Dependency Review above still ran. Set the repository secret to enable them."
            {
              echo "### commitperclip review skipped"
              echo ""
              echo "The commitperclip quality gates did not run: \`COMMITPERCLIP_KEY\` is not configured on this repository,"
              echo "so no commitperclip GitHub App installation token can be minted. The \`Dependency Review\` step above still ran."
              echo ""
              echo "To enable the remaining gates, install the [commitperclip app](https://github.com/apps/commitperclip)"
              echo "on this repository and set the \`COMMITPERCLIP_KEY\` repository secret to its private key."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate commitperclip token
        id: token
        if: steps.key.outputs.present == 'true'
        run: |
          TOKEN=$(node .github/scripts/get-bot-token.mjs)
          echo "::add-mask::$TOKEN"
          echo "value=$TOKEN" >> "$GITHUB_OUTPUT"
        env:
          COMMITPERCLIP_KEY: ${{ secrets.COMMITPERCLIP_KEY }}

      - name: Run quality gates
        id: quality
        if: >-
          steps.key.outputs.present == 'true' &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        run: node .github/scripts/run-quality-gates.mjs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.token.outputs.value }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}

      - name: Fail if quality gates failed
        if: >-
          steps.key.outputs.present == 'true' &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          steps.quality.outcome == 'failure'
        run: |
          echo "One or more quality gates failed. See commitperclip comment on the PR for details."
          exit 1
